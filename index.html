 :root { --primary: #003366; --bg: #f8f9fa; }

 .form-item { margin-bottom: 20px; }

 select, textarea { width: 100%; padding: 12px; border: 1px solid #ddd;

 .secure-badge { background: #e7f3ff; color: #0066cc; padding: 10px;
